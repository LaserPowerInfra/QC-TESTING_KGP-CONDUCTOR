<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QC TESTING_KGP CONDUCTOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif;}
#bgVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:-1}
header{background:#0d6efd;color:#fff;padding:10px;text-align:center;font-size:20px;font-weight:600;position:sticky;top:0;z-index:1000}
.card{max-width:1100px;width:96%;margin:15px auto;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:20px;border-radius:10px}
#loginSection{text-align:center;padding:50px 20px}
.btn-google{background:#fff;color:#444;border:1px solid #ddd;padding:12px 25px;border-radius:50px;font-weight:600;cursor:pointer}
#formSection{display:none}
.user-info{background:#e7f1ff;color:#0d6efd;padding:8px;border-radius:6px;text-align:center;margin-bottom:15px;font-weight:bold}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
label{font-size:11px;font-weight:700}
.req::after{content:" *";color:red}
input,select{width:100%;padding:6px 8px;border:1px solid #aaa;border-radius:4px;font-size:12px;height:32px}
input[readonly]{background:#fffde7;font-weight:800}
.combo{position:relative}
.combo-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;max-height:180px;overflow-y:auto;display:none;z-index:1000}
.combo-list div{padding:6px 10px;cursor:pointer}
.combo-list div:hover{background:#e9ecef}
.btn-group{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.submit-btn{padding:12px;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.btn-exit{background:#546e7a}
.btn-keep{background:#0d6efd}
.logout-container{text-align:center;margin-top:10px}
.logout-btn{border:1px solid #dc3545;color:#dc3545;padding:5px 15px;border-radius:4px;background:#fff;cursor:pointer}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.btn-group{grid-template-columns:1fr}}
</style>
</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline>
  <source src="https://laserpowerinfra.com/wp-content/uploads/2025/09/lpi-video.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<header>QC TESTING_KGP CONDUCTOR</header>

<div class="card">

<div id="loginSection">
  <h3>Welcome User</h3>
  <button onclick="googleLogin()" class="btn-google">Sign in with Google</button>
</div>

<div id="formSection">
  <div class="user-info" id="userInfoDisplay"></div>

  <form class="form-grid" id="entryForm">
    <input type="hidden" id="userEmail" name="userEmail">
    <input type="hidden" id="testedBy" name="testedBy">

    <div><label class="req">Date</label><input type="date" id="entryDate" name="entryDate" required></div>
    <div><label class="req">Shift</label><select name="shift" required><option value="">Select</option><option>DAY</option><option>NIGHT</option></select></div>
    <div><label class="req">MACHINE NO</label><select name="machineNo" required><option value="">Select</option><option>RBD-14</option><option>RBD-17</option><option>RBD-18</option><option>RBD-19</option></select></div>

    <div class="combo">
      <label class="req">COIL NO / BATCH NO</label>
      <input id="coilInput" name="coilBatchNo" autocomplete="off" required>
      <div id="coilList" class="combo-list"></div>
    </div>

    <div><label class="req">M/C NO</label><input name="mcNo" required></div>
    <div><label class="req">Customer Name</label><input name="customerName" required></div>

    <div class="btn-group">
      <button type="button" class="submit-btn btn-exit" onclick="handleFormSubmit(true)">Submit & Exit</button>
      <button type="button" class="submit-btn btn-keep" onclick="handleFormSubmit(false)">Submit & Keep</button>
    </div>
  </form>

  <div class="logout-container">
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyDywbG-rcyBHFB6OhuJesqasadBYDRlrJk",
  authDomain:"laser-html-apps.firebaseapp.com",
  projectId:"laser-html-apps",
  appId:"1:919012116249:web:3699a77a34c8c8facd6788"
};

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwJPfqKIsYl_uFwuGxXQsz-bHlFTKLM1jY_c7CYGA64zmmJqIQk4ZDVM8BYajfwzAJudQ/exec";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const loginSection=document.getElementById("loginSection");
const formSection=document.getElementById("formSection");
const userInfoDisplay=document.getElementById("userInfoDisplay");
const coilInput=document.getElementById("coilInput");
const coilList=document.getElementById("coilList");

let coilData=[];

window.googleLogin=()=>signInWithPopup(auth,provider);
window.logout=()=>signOut(auth).then(()=>location.reload());

onAuthStateChanged(auth,user=>{
  if(user){
    loginSection.style.display="none";
    formSection.style.display="block";
    userInfoDisplay.textContent="👤 "+user.displayName;
    document.getElementById("userEmail").value=user.email;
    document.getElementById("testedBy").value=user.displayName;
    loadCoilList();
  }
});

function loadCoilList(){
  coilInput.placeholder="Loading...";
  fetch(SCRIPT_URL+"?action=getCoilList")
    .then(r=>r.json())
    .then(res=>{
      coilData=res.data||[];
      coilInput.placeholder="Select or type coil...";
    })
    .catch(()=>coilInput.placeholder="Error loading list");
}

coilInput.addEventListener("input",()=>{
  coilList.innerHTML="";
  coilData.filter(c=>c.toLowerCase().includes(coilInput.value.toLowerCase()))
    .slice(0,100)
    .forEach(c=>{
      const d=document.createElement("div");
      d.textContent=c;
      d.onclick=()=>{coilInput.value=c;coilList.style.display="none";}
      coilList.appendChild(d);
    });
  coilList.style.display="block";
});

document.addEventListener("click",e=>{
  if(!coilList.contains(e.target)&&e.target!==coilInput) coilList.style.display="none";
});
</script>

</body>
</html>
