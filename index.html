<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QC TESTING_KGP CONDUCTOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif}
#bgVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:-1}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:600;position:sticky;top:0;z-index:1000}
.card{max-width:850px;margin:30px auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.25)}

#loginSection{text-align:center;padding:50px 20px}
.btn-google{background:#fff;color:#444;border:1px solid #ddd;padding:12px 25px;border-radius:50px;font-weight:600;cursor:pointer}

#formSection{display:none}
.user-info{background:#e7f1ff;color:#0d6efd;padding:10px;border-radius:6px;text-align:center;margin-bottom:20px;font-weight:bold}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full-width{grid-column:1/-1}
label{font-size:13px;font-weight:600; margin-bottom: 5px; display: block;}
.req::after{content:" *";color:red}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}

/* Readonly inputs style (Auto Calculated Fields) */
input[readonly]{background:#e9ecef; cursor: not-allowed; color: #333; font-weight: bold; border-color: #999;}

/* Dropdown Arrow Style */
.combo { position: relative; }
.combo::after {
    content: ''; position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid #666;
    pointer-events: none;
}
.combo input { padding-right: 35px; cursor: pointer; }

.combo-list {
    position:absolute; top:100%; left:0; right:0; background:#fff;
    border:1px solid #ccc; max-height:200px; overflow-y:auto; display:none;
    z-index:100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 0 0 6px 6px;
}
.combo-list div{padding:10px;cursor:pointer;border-bottom: 1px solid #eee;}
.combo-list div:hover{background:#e9ecef}

button.submit-btn{grid-column:1/-1;padding:12px;background:#0d6efd;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer; margin-top:15px;}
.logout-btn{margin-top:15px;border:1px solid #dc3545;color:#dc3545;padding:5px 15px;border-radius:4px;background:none;cursor:pointer}

@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline>
  <source src="https://laserpowerinfra.com/wp-content/uploads/2025/09/lpi-video.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<header>QC TESTING_KGP CONDUCTOR</header>

<div class="card">

<div id="loginSection">
  <h3>Welcome User</h3>
  <button onclick="googleLogin()" class="btn-google">Sign in with Google</button>
</div>

<div id="formSection">
  <div class="user-info" id="userInfoDisplay"></div>

  <form class="form-grid" id="entryForm">
    <input type="hidden" id="userEmail" name="userEmail">
    <input type="hidden" id="testedBy" name="testedBy">

    <div>
      <label class="req">Date</label>
      <input type="date" id="entryDate" name="entryDate" required>
    </div>

    <div><label class="req">Shift</label>
      <select name="shift" required>
        <option value="">Select</option>
        <option>DAY</option><option>NIGHT</option>
      </select>
    </div>

    <div><label class="req">MACHINE NO</label>
      <select name="machineNo" required>
        <option value="">Select</option>
        <option>RBD-14</option><option>RBD-17</option><option>RBD-18</option>
      </select>
    </div>

    <div class="full-width">
      <label class="req">COIL NO / BATCH NO</label>
      <div class="combo" id="comboWrapper">
        <input id="coilInput" name="coilBatchNo" placeholder="Select or type coil..." autocomplete="off" required>
        <div id="coilList" class="combo-list"></div>
      </div>
    </div>

    <div><label class="req">M/C NO</label><input name="mcNo" required></div>
    <div><label class="req">Customer Name</label><input name="customerName" required></div>
    <div><label class="req">Cable Type / Size</label><input name="cableType" required></div>
    
    <div><label class="req">BOBBIN NO / COIL NO / DRUM NO</label>
        <input type="number" name="drumNo" required>
    </div>
    
    <div><label class="req">Process</label>
      <select name="process" required>
        <option value="">Select</option>
        <option>AFTER AGEING</option><option>BEFORE AGEING</option>
      </select>
    </div>

    <div><label class="req">OD/DIA</label><input type="number" step="any" id="odDia" name="odDia" required></div>
    
    <div><label class="req">CR@20 DEG C</label><input type="number" step="any" id="cr20" name="cr20" required></div>
    
    <div><label class="req">BREAKING LOAD</label><input type="number" step="any" id="breakingLoad" name="breakingLoad" required></div>
    
    <div><label class="req">ELONGATION %</label><input type="number" step="any" name="elongation" required></div>
    
    <div><label class="req">UTS (Auto Calc)</label>
      <input type="number" step="any" id="uts" name="uts" readonly required>
    </div>
    
    <div><label class="req">CONDUCTIVITY (Auto Calc)</label>
      <input type="number" step="any" id="conductivity" name="conductivity" readonly required>
    </div>

    <div><label class="req">WEIGHT (Auto Calc)</label>
      <input type="number" step="any" id="weight" name="weight" readonly required>
    </div>

    <div><label class="req">RESISTIVITY (Auto Calc)</label>
      <input type="number" step="any" id="resistivity" name="resistivity" readonly required>
    </div>

    <div><label class="req">TORSION</label><input type="number" step="any" name="torsion" required></div>
    
    <div><label class="req">Results</label>
      <select name="results" required>
        <option value="">Select</option>
        <option>FAIL</option><option>PASS</option><option>OK</option>
      </select>
    </div>

    <div><label class="req">REMARKS</label>
      <select name="remarks" required>
        <option value="">Select</option>
        <option>BL FAIL</option><option>UTS FAIL</option><option>PASS</option><option>OK</option>
      </select>
    </div>
 
   <button class="submit-btn" id="submitBtn">Submit Data</button>
  </form>

  <div style="text-align:center">
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyDywbG-rcyBHFB6OhuJesqasadBYDRlrJk",
  authDomain:"laser-html-apps.firebaseapp.com",
  projectId:"laser-html-apps",
  appId:"1:919012116249:web:3699a77a34c8c8facd6788"
};

// ** REPLACE WITH YOUR NEW DEPLOYED URL **
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwJPfqKIsYl_uFwuGxXQsz-bHlFTKLM1jY_c7CYGA64zmmJqIQk4ZDVM8BYajfwzAJudQ/exec";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const loginSection=document.getElementById("loginSection");
const formSection=document.getElementById("formSection");
const userInfoDisplay=document.getElementById("userInfoDisplay");

// Dropdown Elements
const coilInput = document.getElementById("coilInput");
const coilList = document.getElementById("coilList");
const comboWrapper = document.getElementById("comboWrapper");
let coilData = [];

// --- Default Date to Today ---
document.addEventListener("DOMContentLoaded", () => {
  const dateInput = document.getElementById("entryDate");
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  dateInput.value = `${yyyy}-${mm}-${dd}`;
});

// --- Calculation Logic (ALL FORMULAS) ---
const odInput = document.getElementById("odDia");
const crInput = document.getElementById("cr20");
const blInput = document.getElementById("breakingLoad");

// Outputs
const utsInput = document.getElementById("uts");
const weightInput = document.getElementById("weight");
const resInput = document.getElementById("resistivity");
const condInput = document.getElementById("conductivity");

function calculateAll() {
    const od = parseFloat(odInput.value) || 0;
    const cr = parseFloat(crInput.value) || 0;
    const bl = parseFloat(blInput.value) || 0;

    // 1. Calculate WEIGHT
    // Formula: 3.14/4 * OD * OD * 2.703
    if (od > 0) {
        const weight = (3.14 / 4) * od * od * 2.703;
        weightInput.value = weight.toFixed(2); // 2 Decimals
    } else {
        weightInput.value = "";
    }

    // 2. Calculate RESISTIVITY
    // Formula: 3.14/4 * OD * OD * CR
    let resistivityVal = 0;
    if (od > 0 && cr > 0) {
        resistivityVal = (3.14 / 4) * od * od * cr;
        resInput.value = resistivityVal.toFixed(4); // 4 Decimals
    } else {
        resInput.value = "";
    }

    // 3. Calculate CONDUCTIVITY
    // Formula: 1 / RESISTIVITY * 1724.1
    if (resistivityVal > 0) {
        const cond = (1 / resistivityVal) * 1724.1;
        condInput.value = cond.toFixed(2); // 2 Decimals
    } else {
        condInput.value = "";
    }

    // 4. Calculate UTS
    // Formula: BREAKING LOAD / AREA / 9.8 * 1000
    if (od > 0 && bl > 0) {
        const area = (od * od * 3.142) / 4;
        const uts = (bl / area) / 9.8 * 1000;
        utsInput.value = uts.toFixed(2); // 2 Decimals
    } else {
        utsInput.value = "";
    }
}

// Trigger calculation when any related input changes
odInput.addEventListener("input", calculateAll);
crInput.addEventListener("input", calculateAll);
blInput.addEventListener("input", calculateAll);


window.googleLogin=()=>signInWithPopup(auth,provider);
window.logout=()=>signOut(auth).then(()=>location.reload());

onAuthStateChanged(auth,user=>{
  if(user){
    loginSection.style.display="none";
    formSection.style.display="block";
    userInfoDisplay.textContent="👤 "+user.displayName;
    document.getElementById("userEmail").value=user.email;
    document.getElementById("testedBy").value=user.displayName;
    loadCoilList();
  }
});

function loadCoilList(){
  const cb = "cb_" + Date.now();
  window[cb] = (data) => {
    coilData = Array.isArray(data) ? data : [];
    coilInput.placeholder = "Select or type coil...";
    delete window[cb];
  };
  const s = document.createElement("script");
  s.src = SCRIPT_URL + "?action=getCoilList&callback=" + cb;
  s.onerror = () => coilInput.placeholder = "Error loading list";
  document.body.appendChild(s);
}

function showList(val = "") {
  coilList.innerHTML = "";
  const f = coilData.filter(c => c.toLowerCase().includes(val.toLowerCase()));
  
  if (f.length === 0) {
    coilList.style.display = "none";
    return;
  }
  f.forEach(c => {
    const d = document.createElement("div");
    d.textContent = c;
    d.onclick = () => {
      coilInput.value = c;
      coilList.style.display = "none";
    };
    coilList.appendChild(d);
  });
  coilList.style.display = "block";
}

coilInput.addEventListener("input", () => showList(coilInput.value));
coilInput.addEventListener("click", () => showList(coilInput.value)); 
coilInput.addEventListener("focus", () => showList(coilInput.value));

document.addEventListener("click", e => {
  if (!comboWrapper.contains(e.target)) {
    coilList.style.display = "none";
  }
});

const entryForm = document.getElementById("entryForm");
const submitBtn = document.getElementById("submitBtn");

entryForm.addEventListener("submit",e=>{
  e.preventDefault();
  submitBtn.disabled=true;
  submitBtn.innerText = "Submitting...";
  
  const fd=new FormData(entryForm);
  const obj={};fd.forEach((v,k)=>obj[k]=v);

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(obj)
  })
    .then(r=>r.json())
    .then(res=>{
      if(res.result==="success"){
        Swal.fire("Submitted","Data saved successfully!","success");
        entryForm.reset();
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById("entryDate").value = `${yyyy}-${mm}-${dd}`;

        if(auth.currentUser){
            document.getElementById("userEmail").value = auth.currentUser.email;
            document.getElementById("testedBy").value = auth.currentUser.displayName;
        }
      }else{
        throw new Error(res.message);
      }
    })
    .catch(err=>Swal.fire("Error", "Something went wrong: " + err, "error"))
    .finally(()=>{
        submitBtn.disabled=false;
        submitBtn.innerText = "Submit Data";
    });
});
</script>

</body>
</html>
